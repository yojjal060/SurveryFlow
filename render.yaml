services:
  - type: web
    name: survey-builder-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace=@survey-builder/api && npm run build --workspace=@survey-builder/shared && npm run build --workspace=@survey-builder/api
    startCommand: npm run start --workspace=@survey-builder/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
